
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 3 - Native JavaScript and jQuery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
        }

        #myElement,
        #myDIV {
            margin: 20px 0;
        }

        .myStyle {
            background-color: coral;
            padding: 16px;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
        }
    </style>

    <!-- Official jQuery 4.0.0 full-build CDN -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
</head>

<body>
    <h1>Native JavaScript and jQuery</h1>

    <h2>(a) Change Text</h2>
    <div id="myElement">Original Text</div>

    <h2>(b) Add CSS Class</h2>
    <div id="myDIV">
        <p>I am a myDIV.</p>
    </div>

    <h2>(c) Handle Button Click</h2>
    <button id="myButton">Click me</button>

    <script>
        // (a) Change the text using jQuery.
        $("#myElement").text("Modified Text");

        // (b) Add the required CSS class using jQuery.
        $("#myDIV").addClass("myStyle");

        // (c) Handle the button click using jQuery.
        $("#myButton").on("click", function () {
            alert("Button clicked!");
        });
    </script>
</body>
</html>
