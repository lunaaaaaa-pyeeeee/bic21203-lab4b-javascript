
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 2 - Retrieve JSON Data</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
            background-color: #f5f7fa;
            color: #222;
        }

        h1 {
            color: #1f4e79;
        }

        section {
            background-color: white;
            padding: 18px;
            margin-bottom: 16px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        #status {
            font-weight: bold;
        }

        .error {
            color: #b00020;
        }
    </style>
</head>
<body>
    <h1>Book Information</h1>

    <section>
        <h2>(a) First Book Title</h2>
        <p id="firstTitle">Loading...</p>
    </section>

    <section>
        <h2>(b) Second Book Author</h2>
        <p id="secondAuthor">Loading...</p>
    </section>

    <section>
        <h2>(c) Genres of Both Books</h2>
        <div id="genres">
            <p>Loading book genres...</p>
        </div>
    </section>

    <p id="status" role="status" aria-live="polite">
        Loading book data...
    </p>

    <script>
        async function loadBooks() {
            const firstTitle =
                document.getElementById("firstTitle");

            const secondAuthor =
                document.getElementById("secondAuthor");

            const genresContainer =
                document.getElementById("genres");

            const status =
                document.getElementById("status");

            try {
                const response = await fetch("books.json");

                if (!response.ok) {
                    throw new Error(
                        "Unable to load the book data."
                    );
                }

                const data = await response.json();

                if (
                    !data ||
                    !Array.isArray(data.books) ||
                    data.books.length < 2
                ) {
                    throw new Error(
                        "The JSON data must contain at least two books."
                    );
                }

                const firstBook = data.books[0];
                const secondBook = data.books[1];

                if (
                    typeof firstBook.title !== "string" ||
                    typeof secondBook.author !== "string" ||
                    !Array.isArray(firstBook.genres) ||
                    !Array.isArray(secondBook.genres) ||
                    !firstBook.genres.every(
                        genre => typeof genre === "string"
                    ) ||
                    !secondBook.genres.every(
                        genre => typeof genre === "string"
                    )
                ) {
                    throw new Error(
                        "The book data has an invalid structure."
                    );
                }

                // (a) Display the first book's title.
                firstTitle.textContent = firstBook.title;

                // (b) Display the second book's author.
                secondAuthor.textContent = secondBook.author;

                // (c) Display genres grouped by book title.
                genresContainer.replaceChildren();

                [firstBook, secondBook].forEach(book => {
                    const paragraph = document.createElement("p");

                    paragraph.textContent =
                        book.title + " — " + book.genres.join(", ");

                    genresContainer.appendChild(paragraph);
                });

                status.textContent =
                    "Book data loaded successfully.";

            } catch (error) {
                firstTitle.textContent = "Unavailable";
                secondAuthor.textContent = "Unavailable";
                genresContainer.replaceChildren();

                status.textContent =
                    "Error: " + error.message +
                    " Please check books.json and run this page " +
                    "using a local development server.";

                status.classList.add("error");

                console.error("Failed to load book data:", error);
            }
        }

        loadBooks();
    </script>
</body>
</html>
